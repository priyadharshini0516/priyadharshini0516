name: Latest Blog Posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # RSS feed for dev.to profile
          feed_list: "https://dev.to/feed/priyadharshini0516"
          max_post_count: 4
          template: "- 📝 [$title]($url) — _$date_"
          date_format: "mmm d, yyyy"
