<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priya Dharshini - GitHub Profile README Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
      background-color: #0d1117;
      padding: 45px;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .markdown-body table {
      display: table !important;
      width: 100% !important;
    }
    .markdown-body table tr {
      background-color: #0d1117 !important;
      border-top: 1px solid #21262d !important;
    }
    .markdown-body table td, .markdown-body table th {
      border: 1px solid #30363d !important;
    }
  </style>
</head>
<body>
  <article class="markdown-body" id="content">
    Loading GitHub Profile README...
  </article>

  <script>
    fetch('README.md')
      .then(response => response.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p>Error loading README.md</p>';
      });
  </script>
</body>
</html>
