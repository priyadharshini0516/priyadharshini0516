<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%" preserveAspectRatio="none" style="background:transparent;">
  <defs>
    <!-- Wave Gradients -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FFD5" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD5" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#7B61FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Wave 1 (Back Wave, slower) -->
  <path fill="url(#wave-grad-2)">
    <animate 
      attributeName="d" 
      dur="12s" 
      repeatCount="indefinite"
      values="
        M0 60 C300 20, 600 100, 900 60 C1050 40, 1150 70, 1200 60 L1200 120 L0 120 Z;
        M0 60 C250 80, 550 40, 850 80 C1000 100, 1120 40, 1200 60 L1200 120 L0 120 Z;
        M0 60 C300 20, 600 100, 900 60 C1050 40, 1150 70, 1200 60 L1200 120 L0 120 Z
      "
    />
  </path>

  <!-- Wave 2 (Front Wave, faster) -->
  <path fill="url(#wave-grad-1)">
    <animate 
      attributeName="d" 
      dur="8s" 
      repeatCount="indefinite"
      values="
        M0 70 C350 100, 650 30, 950 70 C1080 90, 1150 50, 1200 70 L1200 120 L0 120 Z;
        M0 70 C300 40, 600 100, 900 40 C1050 20, 1120 90, 1200 70 L1200 120 L0 120 Z;
        M0 70 C350 100, 650 30, 950 70 C1080 90, 1150 50, 1200 70 L1200 120 L0 120 Z
      "
    />
  </path>
</svg>
