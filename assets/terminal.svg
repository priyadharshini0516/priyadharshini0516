<svg fill="none" viewBox="0 0 800 320" width="800" height="320" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .terminal-container {
          background-color: #0d1117;
          border: 1.5px solid #30363d;
          border-radius: 12px;
          box-shadow: 0 8px 32px rgba(88, 166, 255, 0.15), 0 0 20px rgba(188, 140, 255, 0.1);
          font-family: 'Fira Code', 'Courier New', Courier, monospace;
          color: #c9d1d9;
          padding: 0;
          overflow: hidden;
          width: 796px;
          height: 316px;
          box-sizing: border-box;
          animation: glowPulse 4s ease-in-out infinite alternate;
        }
        @keyframes glowPulse {
          0% { border-color: #30363d; box-shadow: 0 8px 32px rgba(88, 166, 255, 0.15); }
          50% { border-color: #58a6ff; box-shadow: 0 8px 32px rgba(88, 166, 255, 0.3), 0 0 20px rgba(0, 229, 255, 0.2); }
          100% { border-color: #bc8cff; box-shadow: 0 8px 32px rgba(188, 140, 255, 0.3), 0 0 20px rgba(188, 140, 255, 0.2); }
        }
        .terminal-header {
          background: linear-gradient(90deg, #161b22 0%, #1c2128 100%);
          padding: 11px 16px;
          display: flex;
          align-items: center;
          border-bottom: 1px solid #30363d;
        }
        .dot {
          height: 12px;
          width: 12px;
          border-radius: 50%;
          display: inline-block;
          margin-right: 8px;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }
        .terminal-title {
          color: #8b949e;
          font-size: 13px;
          margin-left: auto;
          margin-right: auto;
          font-weight: 600;
          letter-spacing: 0.5px;
        }
        .terminal-body {
          padding: 20px 22px;
          font-size: 14px;
          line-height: 1.6;
        }
        .prompt { color: #58a6ff; font-weight: bold; }
        .cmd { color: #7ee787; font-weight: 500; }
        .output { color: #c9d1d9; margin-bottom: 12px; }
        .key { color: #79c0ff; }
        .str { color: #a5d6ff; }
        .badge {
          background: rgba(88, 166, 255, 0.15);
          color: #58a6ff;
          padding: 2px 8px;
          border-radius: 4px;
          font-size: 12px;
          border: 1px solid rgba(88, 166, 255, 0.3);
        }
        .line-1 { animation: fadeIn 0.6s ease-out forwards; }
        .line-2 { animation: fadeIn 0.6s ease-out 0.4s forwards; opacity: 0; }
        .line-3 { animation: fadeIn 0.6s ease-out 0.8s forwards; opacity: 0; }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(4px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .cursor {
          display: inline-block;
          width: 8px;
          height: 16px;
          background-color: #58a6ff;
          margin-left: 6px;
          animation: blink 1s infinite alternate;
          vertical-align: middle;
          border-radius: 1px;
        }
        @keyframes blink {
          0% { opacity: 1; background-color: #58a6ff; }
          100% { opacity: 0.2; background-color: #bc8cff; }
        }
      </style>
      <div class="terminal-container">
        <div class="terminal-header">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
          <span class="terminal-title">⚡ priyadharshini@dev-box:~</span>
        </div>
        <div class="terminal-body">
          <div class="line-1">
            <span class="prompt">priya@dev-box:~$</span> <span class="cmd">whoami</span>
            <div class="output">Priya Dharshini — Full-Stack Developer &amp; AI Engineer <span class="badge">Jaya Eng. College '27</span></div>
          </div>
          
          <div class="line-2">
            <span class="prompt">priya@dev-box:~$</span> <span class="cmd">cat profile.json</span>
            <div class="output">
              {<br/>
              &nbsp;&nbsp;<span class="key">"focus"</span>: [<span class="str">"Full-Stack Web"</span>, <span class="str">"AI Agents"</span>, <span class="str">"System Design"</span>],<br/>
              &nbsp;&nbsp;<span class="key">"stack"</span>: [<span class="str">"React"</span>, <span class="str">"Next.js"</span>, <span class="str">"Node.js"</span>, <span class="str">"FastAPI"</span>, <span class="str">"Python"</span>],<br/>
              &nbsp;&nbsp;<span class="key">"status"</span>: <span class="str">"Building, learning &amp; shipping code 🚀"</span><br/>
              }
            </div>
          </div>
          
          <div class="line-3">
            <span class="prompt">priya@dev-box:~$</span> <span class="cmd">npm run build-future</span><span class="cursor"></span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
