<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" style="background:#0D1117; font-family:system-ui, sans-serif;">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>
    <linearGradient id="grad-purple-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#00FFD5" />
    </linearGradient>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Ambient Light/Background Grid -->
  <g opacity="0.05">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300" stroke="#00E5FF" stroke-width="1" />
    <path d="M 100 0 L 100 350 M 200 0 L 200 350 M 300 0 L 300 350 M 400 0 L 400 350 M 500 0 L 500 350 M 600 0 L 600 350 M 700 0 L 700 350" stroke="#7B61FF" stroke-width="1" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="200" cy="180" r="100" fill="#7B61FF" opacity="0.08" filter="blur(40px)">
    <animate attributeName="cy" values="180;200;180" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="150" r="120" fill="#00E5FF" opacity="0.08" filter="blur(40px)">
    <animate attributeName="cy" values="150;130;150" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Neural Network Connections (Static / Glowing Paths) -->
  <g stroke="url(#grad-cyan-purple)" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <line x1="150" y1="180" x2="280" y2="100" />
    <line x1="150" y1="180" x2="250" y2="260" />
    <line x1="280" y1="100" x2="420" y2="80" />
    <line x1="280" y1="100" x2="380" y2="180" />
    <line x1="250" y1="260" x2="380" y2="180" />
    <line x1="250" y1="260" x2="320" y2="290" />
    <line x1="380" y1="180" x2="520" y2="150" />
    <line x1="420" y1="80" x2="550" y2="100" />
    <line x1="420" y1="80" x2="520" y2="150" />
    <line x1="320" y1="290" x2="480" y2="280" />
    <line x1="480" y1="280" x2="520" y2="150" />
    <line x1="520" y1="150" x2="650" y2="180" />
    <line x1="550" y1="100" x2="650" y2="180" />
    <line x1="480" y1="280" x2="650" y2="180" />
  </g>

  <!-- Animated Data Flows (Flowing dashed lines) -->
  <g stroke="url(#grad-purple-teal)" stroke-width="2" fill="none" opacity="0.8">
    <line x1="150" y1="180" x2="280" y2="100" stroke-dasharray="10 30">
      <animate attributeName="stroke-dashoffset" values="400;0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="280" y1="100" x2="380" y2="180" stroke-dasharray="8 20">
      <animate attributeName="stroke-dashoffset" values="0;300" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="380" y1="180" x2="520" y2="150" stroke-dasharray="12 25">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="520" y1="150" x2="650" y2="180" stroke-dasharray="10 30">
      <animate attributeName="stroke-dashoffset" values="0;400" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="250" y1="260" x2="480" y2="280" stroke-dasharray="15 25">
      <animate attributeName="stroke-dashoffset" values="400;0" dur="6s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Glowing Neural Nodes -->
  <g>
    <!-- Node 1 -->
    <circle cx="150" cy="180" r="6" fill="#00E5FF" filter="url(#glow-cyan)" />
    <circle cx="150" cy="180" r="12" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="6;16;6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Node 2 -->
    <circle cx="280" cy="100" r="5" fill="#7B61FF" filter="url(#glow-purple)" />
    <circle cx="280" cy="100" r="10" fill="none" stroke="#7B61FF" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="5;14;5" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Node 3 -->
    <circle cx="250" cy="260" r="5" fill="#00FFD5" filter="url(#glow-cyan)" />

    <!-- Node 4 -->
    <circle cx="380" cy="180" r="7" fill="#7B61FF" filter="url(#glow-purple)" />
    <circle cx="380" cy="180" r="15" fill="none" stroke="#7B61FF" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="7;18;7" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <!-- Node 5 -->
    <circle cx="420" cy="80" r="5" fill="#00E5FF" filter="url(#glow-cyan)" />

    <!-- Node 6 -->
    <circle cx="320" cy="290" r="4" fill="#7B61FF" opacity="0.8" />

    <!-- Node 7 -->
    <circle cx="480" cy="280" r="6" fill="#00FFD5" filter="url(#glow-cyan)" />
    <circle cx="480" cy="280" r="12" fill="none" stroke="#00FFD5" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="6;15;6" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Node 8 -->
    <circle cx="520" cy="150" r="8" fill="#00E5FF" filter="url(#glow-cyan)" />
    <circle cx="520" cy="150" r="18" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="8;22;8" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.05;0.9" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 9 -->
    <circle cx="550" cy="100" r="4" fill="#7B61FF" opacity="0.8" />

    <!-- Node 10 (Target Output Node) -->
    <circle cx="650" cy="180" r="8" fill="#00FFD5" filter="url(#glow-cyan)" />
    <circle cx="650" cy="180" r="20" fill="none" stroke="#00FFD5" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="8;25;8" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Overlay Text (Futuristic / Minimal) -->
  <text x="50" y="325" fill="#FFFFFF" font-size="10" letter-spacing="3" opacity="0.3">NEURAL NETWORK ENGINE v1.0.0</text>
  <text x="630" y="325" fill="#00E5FF" font-size="10" letter-spacing="3" opacity="0.5">ACTIVE STATE</text>
</svg>
